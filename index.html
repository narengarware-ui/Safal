<style>
:root{
  --green-dark:#1F4E2C;
  --green:#3E7B4F;
  --green-soft:#E7F0E5;
  --turmeric:#E8A33D;
  --turmeric-soft:#FBEBD1;
  --soil:#4A3423;
  --bg:#F6F4EC;
  --card:#FFFFFF;
  --line:#E4DFD0;
  --text:#2B2620;
  --text-mute:#7A7264;
  --red:#C24A3B;
  --red-soft:#FBE7E3;
  --radius:16px;
  --shadow:0 2px 10px rgba(74,52,35,0.08);
}
*{box-sizing:border-box;}
body{margin:0;padding:0;}
body,input,select,textarea,button{font-family:'Inter',sans-serif;}
h1,h2,h3,.font-display{font-family:'Poppins',sans-serif;}
.dv{font-family:'Noto Sans Devanagari',sans-serif;}
#app{
  max-width:480px;
  margin:0 auto;
  background:var(--bg);
  min-height:100vh;
  color:var(--text);
  position:relative;
  padding-bottom:78px;
}
header.top{
  background:linear-gradient(135deg,var(--green-dark),var(--green));
  color:#fff;
  padding:18px 18px 22px;
  border-radius:0 0 22px 22px;
  box-shadow:var(--shadow);
}
header.top .eyebrow{font-size:12px;opacity:0.85;letter-spacing:0.4px;margin-bottom:2px;}
header.top h1{margin:0;font-size:21px;font-weight:700;}
header.top .sub{font-size:12.5px;opacity:0.9;margin-top:4px;}
main{padding:14px 14px 10px;}
.section-title{font-size:15px;font-weight:700;color:var(--green-dark);margin:18px 0 8px;display:flex;align-items:center;gap:6px;}
.section-title .tag{font-size:11px;font-weight:600;color:var(--text-mute);background:var(--line);padding:2px 8px;border-radius:20px;margin-left:auto;}
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.stat-row{display:flex;gap:10px;margin-top:12px;}
.stat{flex:1;background:rgba(255,255,255,0.14);border-radius:12px;padding:10px 12px;}
.stat .num{font-size:19px;font-weight:700;font-family:'Poppins',sans-serif;}
.stat .lbl{font-size:10.5px;opacity:0.85;margin-top:1px;}
.btn{
  border:none;border-radius:12px;padding:10px 16px;font-weight:600;font-size:13.5px;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:active{background:var(--green-dark);}
.btn-accent{background:var(--turmeric);color:#3a2809;}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--text);}
.btn-ghost{background:var(--green-soft);color:var(--green-dark);}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:9px;}
.btn-full{width:100%;justify-content:center;}
.row-between{display:flex;justify-content:space-between;align-items:center;}
label{font-size:12px;font-weight:600;color:var(--text-mute);display:block;margin:10px 0 4px;}
input,select,textarea{
  width:100%;padding:10px 11px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;font-size:14px;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);border-color:var(--green);}
textarea{resize:vertical;min-height:50px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
.form-card{background:var(--green-soft);border:1px dashed var(--green);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.form-card h3{margin:0 0 2px;font-size:14.5px;color:var(--green-dark);}
.plot-card{border-left:4px solid var(--green);}
.plot-head{display:flex;justify-content:space-between;align-items:flex-start;}
.plot-name{font-weight:700;font-size:15px;}
.plot-veg{font-size:12.5px;color:var(--text-mute);}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.badge-green{background:var(--green-soft);color:var(--green-dark);}
.badge-turmeric{background:var(--turmeric-soft);color:#8a5a12;}
.badge-red{background:var(--red-soft);color:var(--red);}
.progress-track{height:7px;background:var(--line);border-radius:6px;margin:10px 0 4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--turmeric));border-radius:6px;}
.stage-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-mute);}
.mini-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.empty{
  text-align:center;padding:36px 16px;color:var(--text-mute);
}
.empty .icon{font-size:34px;margin-bottom:8px;}
.log-item{border-bottom:1px solid var(--line);padding:9px 0;display:flex;justify-content:space-between;gap:8px;}
.log-item:last-child{border-bottom:none;}
.log-item .meta{font-size:11.5px;color:var(--text-mute);margin-top:2px;}
.log-item .amt{font-weight:700;font-size:13.5px;white-space:nowrap;}
.pill-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;}
.pill{padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--text-mute);cursor:pointer;}
.pill.active{background:var(--green-dark);color:#fff;border-color:var(--green-dark);}
nav.bottom{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:7px 2px 9px;box-shadow:0 -2px 12px rgba(0,0,0,0.06);
  z-index:20;
}
nav.bottom .nitem{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:9.5px;color:var(--text-mute);font-weight:600;cursor:pointer;
  flex:1;padding:4px 0;
}
nav.bottom .nitem .ic{font-size:19px;}
nav.bottom .nitem.active{color:var(--green-dark);}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.summary-box{border-radius:12px;padding:12px;}
.summary-box.income{background:var(--green-soft);}
.summary-box.expense{background:var(--red-soft);}
.summary-box .lbl{font-size:11px;color:var(--text-mute);font-weight:600;}
.summary-box .val{font-size:18px;font-weight:700;margin-top:2px;font-family:'Poppins',sans-serif;}
.divider{height:1px;background:var(--line);margin:12px 0;}
.tip-box{background:var(--turmeric-soft);border-radius:12px;padding:10px 12px;font-size:12px;color:#6b4610;margin-top:8px;}
.close-x{background:none;border:none;font-size:18px;color:var(--text-mute);cursor:pointer;padding:0 4px;}
a.linklike{color:var(--green-dark);font-weight:600;text-decoration:underline;cursor:pointer;font-size:12.5px;}
.toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
  background:var(--soil);color:#fff;padding:9px 16px;border-radius:20px;
  font-size:12.5px;z-index:40;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;
  max-width:420px;text-align:center;
}
.toast.show{opacity:1;}
::-webkit-scrollbar{height:5px;width:5px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>

async function loadKey(key, fallback){
  if(cloudConnected){
    try{
      const snap = await fbDb.ref(`${DB_ROOT}/${key}`).once('value');
      const v = snap.val();
      return v!==null && v!==undefined ? v : fallback;
    }catch(e){ console.error("cloud load failed", key, e); }
  }
  try{
    const local = localStorage.getItem(`${DB_ROOT}:${key}`);
    return local ? JSON.parse(local) : fallback;
  }catch(e){ return fallback; }
}
async function saveKey(key, value){
  // Always keep a local copy immediately so the UI never waits on network
  try{ localStorage.setItem(`${DB_ROOT}:${key}`, JSON.stringify(value)); }catch(e){}
  if(cloudConnected){
    try{ await fbDb.ref(`${DB_ROOT}/${key}`).set(value); }
    catch(e){ console.error("cloud save failed", key, e); showToast("⚠️ Saved on this device only — cloud sync failed."); }
  }
}

const KEY_TO_STATE = {'farm-settings':'settings','plots':'plots','nutrition-logs':'nutrition','maintenance-logs':'maintenance','market-sales':'sales','expenses':'expenses',
  'poultry-batches':'batches','egg-logs':'eggLogs','poultry-health-logs':'poultryHealth','poultry-sales':'poultrySales','poultry-expenses':'poultryExpenses'};
function attachLiveSync(){
  if(!cloudConnected) return;
  STORE_KEYS.forEach(key=>{
    fbDb.ref(`${DB_ROOT}/${key}`).on('value', snap=>{
      const v = snap.val();
      const stateField = KEY_TO_STATE[key];
      const incoming = v!==null && v!==undefined ? v : (stateField==='settings'? S.settings : []);
      if(JSON.stringify(S[stateField]) !== JSON.stringify(incoming)){
        S[stateField] = incoming;
        try{ localStorage.setItem(`${DB_ROOT}:${key}`, JSON.stringify(incoming)); }catch(e){}
        render();
      }
    });
  });
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return "-"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000); }
function addDays(d,n){ const dt=new Date(d+"T00:00:00"); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function money(n){ return "₹"+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0}); }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- Crop stage computation ---------------- */
function getPlotProgress(plot){
  const crop = CROP_DB[plot.vegetable];
  if(!crop) return null;
  const elapsed = daysBetween(plot.sowingDate, todayStr());
  const duration = crop.duration;
  const pct = Math.max(0, Math.min(100, Math.round((elapsed/duration)*100)));
  let stageIdx = 0;
  for(let i=0;i<crop.stages.length;i++){ if(elapsed >= crop.stages[i][1]) stageIdx = i; }
  const stageName = crop.stages[stageIdx][0];
  let nextStage = crop.stages[stageIdx+1] || null;
  const harvestEndDate = addDays(plot.sowingDate, duration);
  return {elapsed, duration, pct, stageName, nextStage, harvestEndDate, crop};
}

function upcomingEvents(days=10){
  const events=[];
  S.plots.forEach(p=>{
    const crop=CROP_DB[p.vegetable]; if(!crop) return;
    crop.stages.forEach(([label,day])=>{
      const date = addDays(p.sowingDate, day);
      const diff = daysBetween(todayStr(), date);
      if(diff>=0 && diff<=days) events.push({date, plot:p.name, veg:p.vegetable, label, diff});
    });
  });
  events.sort((a,b)=>a.diff-b.diff);
  return events;
}

function renderCalendar(){
  const events=[];
  S.plots.forEach(p=>{
    const crop = CROP_DB[p.vegetable]; if(!crop) return;
    crop.stages.forEach(([label,day])=>{
      events.push({date:addDays(p.sowingDate,day), plot:p.name, plotId:p.id, veg:p.vegetable, label, day});
    });
  });
  events.sort((a,b)=> new Date(a.date)-new Date(b.date));
  const filtered = ui.plotForCalendarFilter==='all'? events : events.filter(e=>e.plotId===ui.plotForCalendarFilter);
  const today = todayStr();
  let lastMonth = "";
  const rows = filtered.map(e=>{
    const mo = new Date(e.date+"T00:00:00").toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    let monthHeader = "";
    if(mo!==lastMonth){ monthHeader = `<div style="font-weight:700;color:var(--green-dark);font-size:12.5px;margin:12px 0 4px;">${mo}</div>`; lastMonth=mo; }
    const isPast = e.date < today;
    const isToday = e.date===today;
    return monthHeader + `<div class="log-item">
      <div><b>${esc(e.plot)}</b> — ${esc(e.veg)}<div class="meta">${e.label}</div></div>
      <div class="amt" style="color:${isToday?'var(--red)':isPast?'var(--text-mute)':'var(--green-dark)'}">${fmtDate(e.date)}</div>
    </div>`;
  }).join('');
  return `
  <div class="section-title">📅 Crop calendar<span class="tag">Auto-generated from sowing dates</span></div>
  <div class="pill-tabs">
    <div class="pill ${ui.plotForCalendarFilter==='all'?'active':''}" onclick="ui.plotForCalendarFilter='all';render();">All plots</div>
    ${S.plots.map(p=>`<div class="pill ${ui.plotForCalendarFilter===p.id?'active':''}" onclick="ui.plotForCalendarFilter='${p.id}';render();">${esc(p.name)}</div>`).join('')}
  </div>
  <div class="card">
    ${S.plots.length===0? `<div class="empty"><div class="icon">📭</div>Add plots first — the calendar builds itself from each crop's sowing date.</div>` :
      (filtered.length? rows : `<div class="empty"><div class="icon">📭</div>No events for this filter.</div>`)}
  </div>
  `;
}

/* ---- NUTRITION & PEST CONTROL ---- */
function buildNutritionPlan(plot){
  const crop = CROP_DB[plot.vegetable];
  if(!crop || !crop.nutritionPlan) return [];
  const area = Number(plot.area)||1;
  return crop.nutritionPlan.map(item=>{
    const date = addDays(plot.sowingDate, item.day);
    const totalQty = item.qty!=null ? (item.qty*area).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1') : null;
    const amountLabel = (item.qty!=null)
      ? (ui.lang==='mr'
          ? `या प्लॉटसाठी एकूण ${totalQty} ${item.unit} (दर गुंठ्याला ${item.qty} ${item.unit} × ${area} गुंठा)`
          : `${totalQty} ${item.unit} for this plot (${item.qty} ${item.unit}/Guntha × ${area} Guntha)`)
      : null;
    return {...item, date, amountLabel};
  });
}

function renderPestDetail(name){
  const p = PEST_DB[name];
  if(!p) return `<div class="tip-box" style="background:transparent;">• ${esc(name)}</div>`;
  const displayName = trPestName(name);
  const symptoms = trPestField(name,'symptoms') || p.symptoms;
  const organic = trPestField(name,'organic') || p.organic;
  const chemical = trPestField(name,'chemical') || p.chemical;
  return `<details style="margin-bottom:6px;">
    <summary style="cursor:pointer;font-weight:600;font-size:12.5px;">${esc(displayName)}</summary>
    <div style="font-size:12px;margin:6px 0 2px;"><b>${ui.lang==='mr'?'लक्षणे':'Symptoms'}:</b> ${esc(symptoms)}</div>
    <div style="font-size:12px;margin:4px 0;"><b>🌿 ${ui.lang==='mr'?'सेंद्रिय/पारंपरिक उपाय':'Organic/cultural control'}:</b> ${esc(organic)}</div>
    <div style="font-size:12px;margin:4px 0;"><b>🧪 ${ui.lang==='mr'?'रासायनिक उपाय':'Chemical control'}:</b> ${esc(chemical)}</div>
  </details>`;
}
function renderPestLibraryItems(term){
  const t = (term||'').trim().toLowerCase();
  const names = Object.keys(PEST_DB).filter(n=> !t || n.toLowerCase().includes(t) || (PEST_MR[n] && PEST_MR[n].name.includes(term||'')));
  if(!names.length) return `<div class="empty" style="padding:14px;"><div class="icon">🔍</div>${ui.lang==='mr'?'काही जुळले नाही. दुसरा शब्द वापरून पहा.':'No match. Try a different word.'}</div>`;
  return names.map(n=>renderPestDetail(n)).join('');
}
function filterPestLibrary(term){
  ui.pestSearch = term;
  const el = document.getElementById('pestLibraryResults');
  if(el) el.innerHTML = renderPestLibraryItems(term);
}

/* -- Health / vaccination -- */
function buildVaccinationPlan(batch){
  return VACCINATION_SCHEDULE.map((item,i)=>{
    const date = addDays(batch.acquiredDate, item.day);
    const mr = VACC_MR[i] || {};
    const name = ui.lang==='mr' ? (mr.name||item.name) : item.name;
    const method = ui.lang==='mr' ? (mr.method||item.method) : item.method;
    const note = ui.lang==='mr' ? (mr.note||item.note) : item.note;
    return {...item, date, name, method, note};
  });
}

  return `

  <div class="pill-tabs">

  </div>
  ${activeBatch ? `
    <div class="section-title" style="margin-top:6px;">💉 ${ui.lang==='mr'?'लसीकरण व जंतनाशक योजना':'Vaccination & deworming plan'} – ${esc(activeBatch.name)}</div>
    <div class="card" style="padding:8px 14px;">
      ${buildVaccinationPlan(activeBatch).map((item,i)=>{
        const today = todayStr();
        const isPast = item.date < today, isToday = item.date===today;
        const statusColor = isToday?'var(--red)':isPast?'var(--text-mute)':'var(--green-dark)';

          <div>
            <div><b>${esc(item.name)}</b></div>

      }).join('')}
      <div style="margin-top:8px;font-size:11px;color:var(--text-mute);">${ui.lang==='mr'?'ही सर्वसाधारण देशी कोंबडी पालन वेळापत्रक आहे — वेळ व मात्रेबाबत नेहमी तुमच्या स्थानिक पशुवैद्यक किंवा पशुसंवर्धन विभाग अधिकाऱ्यांकडून खात्री करा.':'This is a general backyard/desi poultry schedule — always confirm timing and dose with your local veterinarian or Pashusanvardhan Vibhag (Animal Husbandry) officer.'}</div>

    </div>
    <div class="form-grid">
      <div><label>Quantity (kg)</label><input id="sf_qty" type="number" step="0.1" oninput="updateSaleTotal()"></div>
      <div><label>Price / kg (₹)</label><input id="sf_price" type="number" step="0.1" oninput="updateSaleTotal()"></div>
    </div>
    <label>Buyer / market (e.g. APMC Karad, local trader)</label><input id="sf_buyer" placeholder="APMC Karad">
    <label>Total amount (₹)</label><input id="sf_total" type="number" readonly style="background:var(--green-soft);font-weight:700;">
    <div class="mini-row" style="margin-top:8px;">
      <button class="btn btn-primary" onclick="saveSale()">Save sale</button>
      <button class="btn btn-outline" onclick="ui.showSaleForm=false;render();">Cancel</button>
    </div>
  </div>`;
}
function updateSaleTotal(){
  const q = Number(document.getElementById('sf_qty').value)||0;
  const p = Number(document.getElementById('sf_price').value)||0;
  document.getElementById('sf_total').value = (q*p).toFixed(2);
}
async function saveSale(){
  const plotId = document.getElementById('sf_plot').value;
  const vegetable = document.getElementById('sf_veg').value;
  const date = document.getElementById('sf_date').value;
  const qty = Number(document.getElementById('sf_qty').value)||0;
  const price = Number(document.getElementById('sf_price').value)||0;
  const buyer = document.getElementById('sf_buyer').value.trim();
  const totalAmount = qty*price;
  if(qty<=0){ showToast('Enter quantity sold'); return; }
  S.sales.push({id:uid(), plotId, vegetable, date, qty, price, buyer, totalAmount});
  await saveKey('market-sales', S.sales);
  ui.showSaleForm=false; showToast('Sale recorded'); render();
}
async function deleteSale(id){
  S.sales = S.sales.filter(s=>s.id!==id);
  await saveKey('market-sales', S.sales);
  render();
}
function renderSaleLog(s){
  const p = S.plots.find(x=>x.id===s.plotId);
  return `<div class="log-item">
    <div><b>${esc(s.vegetable)}</b> · ${s.qty}kg @ ₹${s.price}<div class="meta">${p?esc(p.name)+' · ':''}${esc(s.buyer||'—')} · ${fmtDate(s.date)}</div></div>
    <div style="text-align:right;"><div class="amt">${money(s.totalAmount)}</div><button class="close-x" onclick="deleteSale('${s.id}')">✕</button></div>
  </div>`;
}

/* ---- ACCOUNTS / BOOKKEEPING ---- */
function renderAccounts(){
  const expenses = S.expenses.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const byCat = {};
  S.expenses.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+Number(e.amount||0); });
  const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const income = totalIncome(), exp = totalExpenses(), net = income-exp;
  return `
  <div class="section-title">💰 Bookkeeping — whole farm</div>
  <div class="card">
    <div class="summary-grid">
      <div class="summary-box income"><div class="lbl">Total income (veg + poultry)</div><div class="val">${money(income)}</div></div>
      <div class="summary-box expense"><div class="lbl">Total expenses (veg + poultry)</div><div class="val">${money(exp)}</div></div>
    </div>
    <div class="divider"></div>
    <div class="row-between"><span style="font-weight:700;font-size:15px;">Net profit — whole farm</span><span style="font-weight:800;font-size:17px;color:${net>=0?'var(--green-dark)':'var(--red)'}">${money(net)}</span></div>
  </div>
  <div class="section-title">🥬 Vegetable side — detail</div>
  ${ui.showExpForm ? renderExpForm() : `<button class="btn btn-primary btn-full" onclick="ui.showExpForm=true;render();">+ Add expense</button>`}
  ${catRows.length? `<div class="card">
    <b style="font-size:13px;">Expenses by category</b>
    ${catRows.map(([c,amt])=>`<div class="log-item"><div>${esc(c)}</div><div class="amt">${money(amt)}</div></div>`).join('')}
  </div>`:''}
  <div class="section-title">All expenses</div>
  <div class="card">
    ${expenses.length? expenses.map(e=>renderExpLog(e)).join('') : `<div class="empty"><div class="icon">💰</div>No expenses logged yet.</div>`}
  </div>
  <div class="section-title">Per-plot profit &amp; loss<span class="tag">where linked</span></div>
  <div class="card">
    ${S.plots.length? S.plots.map(p=>{
      const inc = S.sales.filter(s=>s.plotId===p.id).reduce((a,s)=>a+Number(s.totalAmount||0),0);
      const ex = S.expenses.filter(e=>e.plotId===p.id).reduce((a,e)=>a+Number(e.amount||0),0);
      const pnet = inc-ex;
      return `<div class="log-item"><div><b>${esc(p.name)}</b><div class="meta">${p.vegetable} · Income ${money(inc)} − Expense ${money(ex)}</div></div><div class="amt" style="color:${pnet>=0?'var(--green-dark)':'var(--red)'}">${money(pnet)}</div></div>`;
    }).join('') : `<div class="empty" style="padding:14px;">Add plots to see profit per plot.</div>`}
  </div>
  <div class="tip-box">🐔 For poultry income/expenses in detail, go to <b>Poultry → Bookkeeping</b>. Its totals are already folded into the whole-farm summary above.</div>
  `;
}
function renderExpForm(){
  return `
  <div class="form-card">
    <h3>New expense</h3>
    <div class="form-grid">
      <div><label>Date</label><input id="ef_date" type="date" value="${todayStr()}"></div>
      <div><label>Category</label><select id="ef_cat">${EXP_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    </div>
    <label>Linked plot (optional)</label>
    <select id="ef_plot"><option value="">— general farm expense —</option>${S.plots.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.vegetable}</option>`).join('')}</select>
    <label>Description</label><input id="ef_desc" placeholder="e.g. Urea 2 bags">
    <label>Amount (₹)</label><input id="ef_amt" type="number" step="0.1">
    <div class="mini-row" style="margin-top:8px;">
      <button class="btn btn-primary" onclick="saveExpense()">Save expense</button>
      <button class="btn btn-outline" onclick="ui.showExpForm=false;render();">Cancel</button>
    </div>
  </div>`;
}
async function saveExpense(){
  const date = document.getElementById('ef_date').value;
  const category = document.getElementById('ef_cat').value;
  const plotId = document.getElementById('ef_plot').value;
  const description = document.getElementById('ef_desc').value.trim();
  const amount = Number(document.getElementById('ef_amt').value)||0;
  if(amount<=0){ showToast('Enter an amount'); return; }
  S.expenses.push({id:uid(), date, category, plotId, description, amount});
  await saveKey('expenses', S.expenses);
  ui.showExpForm=false; showToast('Expense added'); render();
}
async function deleteExpense(id){
  S.expenses = S.expenses.filter(e=>e.id!==id);
  await saveKey('expenses', S.expenses);
  render();
}
function renderExpLog(e){
  const p = S.plots.find(x=>x.id===e.plotId);
  return `<div class="log-item">
    <div><b>${esc(e.category)}</b>${e.description?' · '+esc(e.description):''}<div class="meta">${p?esc(p.name)+' · ':''}${fmtDate(e.date)}</div></div>
    <div style="text-align:right;"><div class="amt">${money(e.amount)}</div><button class="close-x" onclick="deleteExpense('${e.id}')">✕</button></div>
  </div>`;
}

/* ---------------- Boot ---------------- */
function attachGlobalHandlers(){ /* all handlers are inline for simplicity */ }
(async function init(){
  await loadAll();
  render();
  attachLiveSync();
})();
</script>
</body>
</html>
